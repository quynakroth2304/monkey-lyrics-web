<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfect 3D Hollow Heart</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // --- CẤU HÌNH ---
        const SETTINGS = {
            particles: 15000,          
            color: 0xff0055,           
            size: 1.2,                 
            pulseSpeed: 3.5,           
            textRing1: "Anh Yêu Em ❤️ ",
            textRing2: "Mãi Bên Nhau ❤️ "
        };

        let scene, camera, renderer, composer, controls;
        let heartSystem, ring1, ring2, magicParticles; // Thêm biến magicParticles
        let time = 0;

        init();
        animate();

        function init() {
            // 1. Scene
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.002);

            // 2. Camera
            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 2000);
            camera.position.set(0, 20, 100); 

            // 3. Renderer
            renderer = new THREE.WebGLRenderer({ antialias: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.toneMapping = THREE.ReinhardToneMapping;
            document.body.appendChild(renderer.domElement);

            // 4. Post-processing
            const renderScene = new RenderPass(scene, camera);
            const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
            bloomPass.threshold = 0.1;
            bloomPass.strength = 1.2; 
            bloomPass.radius = 0.5;

            composer = new EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloomPass);

            // 5. Controls
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.autoRotate = true;     
            controls.autoRotateSpeed = 1.0; 
            controls.maxPolarAngle = Math.PI / 1.5; 

            // 6. Tạo vật thể
            createHollowHeart();
            createStandingRings(); // Hàm mới: Dựng chữ đứng
            createMagicParticles(); // Hàm mới: Tạo đốm trắng quanh chữ
            createSpaceDust();     // Bụi vũ trụ xa xa

            window.addEventListener('resize', onWindowResize);
        }

        // --- TẠO TRÁI TIM RỖNG ---
        function createHollowHeart() {
            const geometry = new THREE.BufferGeometry();
            const positions = [];
            const colors = [];
            const sizes = [];

            const colorBase = new THREE.Color(SETTINGS.color);
            const colorTip = new THREE.Color(0xffaaaa); 

            for (let i = 0; i < SETTINGS.particles; i++) {
                const u = Math.random() * Math.PI * 2;
                const v = Math.random() * Math.PI; 

                let x = 16 * Math.pow(Math.sin(u), 3) * Math.sin(v);
                let y = (13 * Math.cos(u) - 5 * Math.cos(2*u) - 2 * Math.cos(3*u) - Math.cos(4*u));
                let z = 16 * Math.pow(Math.sin(u), 3) * Math.cos(v); 

                const thickness = 0.9 + Math.random() * 0.1;
                x *= thickness; y *= thickness; z *= thickness;
                y += 5;

                positions.push(x, y, z);

                const normalizedY = (y + 10) / 25; 
                const finalColor = colorBase.clone().lerp(colorTip, normalizedY * 0.5);
                colors.push(finalColor.r, finalColor.g, finalColor.b);

                sizes.push(Math.random() * 1.5 + 0.5);
            }

            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            geometry.setAttribute('size', new THREE.Float32BufferAttribute(sizes, 1));
            
            geometry.userData.originalPositions = Float32Array.from(positions);

            const material = new THREE.PointsMaterial({
                size: SETTINGS.size,
                vertexColors: true,
                map: getSoftTexture(),
                blending: THREE.AdditiveBlending,
                depthWrite: false, 
                transparent: true,
                opacity: 0.8       
            });

            heartSystem = new THREE.Points(geometry, material);
            scene.add(heartSystem);
        }

        // --- VÒNG CHỮ ĐỨNG (Dùng Cylinder thay vì Plane) ---
        function createStandingRings() {
            // Vòng 1 (Nhỏ, bên trong)
            // CylinderGeometry(bán kính trên, bán kính dưới, chiều cao, segments, mở nắp)
            const geo1 = new THREE.CylinderGeometry(25, 25, 5, 64, 1, true);
            const mat1 = new THREE.MeshBasicMaterial({ 
                // Lặp lại chuỗi text 2 lần cho nó dài ra
                map: createStraightTextTexture(SETTINGS.textRing1.repeat(3)), 
                transparent: true, 
                opacity: 0.8, 
                blending: THREE.AdditiveBlending, 
                side: THREE.DoubleSide, 
                depthWrite: false 
            });
            ring1 = new THREE.Mesh(geo1, mat1);
            ring1.position.y = -12; // Hạ thấp xuống dưới tim
            scene.add(ring1);

            // Vòng 2 (Lớn, bên ngoài)
            const geo2 = new THREE.CylinderGeometry(35, 35, 7, 64, 1, true);
            const mat2 = new THREE.MeshBasicMaterial({ 
                map: createStraightTextTexture(SETTINGS.textRing2.repeat(4)), 
                transparent: true, 
                opacity: 0.5, 
                blending: THREE.AdditiveBlending, 
                side: THREE.DoubleSide, 
                depthWrite: false 
            });
            ring2 = new THREE.Mesh(geo2, mat2);
            ring2.position.y = -13; 
            scene.add(ring2);
        }

        // --- ĐỐM TRẮNG HUYỀN ẢO (Magic Particles) ---
        function createMagicParticles() {
            const particleCount = 300;
            const geo = new THREE.BufferGeometry();
            const pos = [];
            const sizes = [];

            for(let i=0; i<particleCount; i++) {
                // Tạo vị trí ngẫu nhiên quanh khu vực vòng chữ
                const angle = Math.random() * Math.PI * 2;
                // Bán kính từ 20 đến 45 (bao quanh cả 2 vòng chữ)
                const radius = 20 + Math.random() * 25; 
                const x = Math.cos(angle) * radius;
                const z = Math.sin(angle) * radius;
                // Chiều cao dao động quanh khu vực chữ
                const y = -15 + Math.random() * 15; 

                pos.push(x, y, z);
                sizes.push(Math.random() * 1.0); // Kích thước hạt
            }

            geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
            geo.setAttribute('size', new THREE.Float32BufferAttribute(sizes, 1));

            // Texture đốm trắng đơn giản
            const mat = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 1.0,
                map: getSoftTexture(), // Tận dụng lại texture tròn mờ của tim
                transparent: true,
                opacity: 0.6,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            magicParticles = new THREE.Points(geo, mat);
            scene.add(magicParticles);
        }

        // --- Helper Vẽ Chữ Thẳng (Để map vào hình trụ) ---
        function createStraightTextTexture(text) {
            const canvas = document.createElement('canvas');
            // Canvas dài ngang để chứa chữ
            canvas.width = 2048; 
            canvas.height = 256; 
            const ctx = canvas.getContext('2d');
            
            // Background trong suốt
            ctx.fillStyle = 'rgba(0,0,0,0)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.font = 'bold 80px Arial'; // Font to
            ctx.fillStyle = '#ff88aa';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = '#ff0055';
            ctx.shadowBlur = 20;

            // Vẽ chữ vào chính giữa canvas
            ctx.fillText(text, canvas.width / 2, canvas.height / 2);

            const texture = new THREE.CanvasTexture(canvas);
            return texture;
        }

        // --- BỤI KHÔNG GIAN (Nền xa) ---
        function createSpaceDust() {
            const geo = new THREE.BufferGeometry();
            const pos = [];
            for(let i=0; i<2000; i++) pos.push((Math.random()-0.5)*300, (Math.random()-0.5)*300, (Math.random()-0.5)*300);
            geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
            const mat = new THREE.PointsMaterial({color: 0xffffff, size: 0.8, transparent: true, opacity: 0.3});
            const dust = new THREE.Points(geo, mat);
            scene.add(dust);
        }

        function getSoftTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 32; canvas.height = 32;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(16,16,0,16,16,16);
            grad.addColorStop(0, 'rgba(255,255,255,1)');
            grad.addColorStop(0.4, 'rgba(255,100,100,0.5)');
            grad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0,0,32,32);
            return new THREE.CanvasTexture(canvas);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;

            controls.update(); 

            // Nhịp tim
            const beatValue = Math.pow(Math.sin(time * SETTINGS.pulseSpeed), 1);
            const scale = 1 + beatValue * 0.1; 

            if (heartSystem) {
                const positions = heartSystem.geometry.attributes.position.array;
                const originals = heartSystem.geometry.userData.originalPositions;
                
                for(let i=0; i<positions.length; i+=3) {
                    const ox = originals[i];
                    const oy = originals[i+1];
                    const oz = originals[i+2];

                    positions[i] = ox * scale;
                    positions[i+1] = (oy - 5) * scale + 5;
                    positions[i+2] = oz * scale;
                }
                heartSystem.geometry.attributes.position.needsUpdate = true;
            }

            // Xoay vòng chữ (Dùng rotation.y vì giờ nó là hình trụ đứng)
            if(ring1) ring1.rotation.y += 0.005; // Quay chậm
            if(ring2) ring2.rotation.y -= 0.003; // Quay ngược chiều

            // Hiệu ứng cho đốm trắng
            if(magicParticles) {
                magicParticles.rotation.y += 0.002; // Cả hệ thống hạt xoay nhẹ
                // Làm hạt nhấp nhô nhẹ
                magicParticles.position.y = Math.sin(time * 0.5) * 1.5;
            }

            composer.render();
        }
    </script>
</body>
</html>
